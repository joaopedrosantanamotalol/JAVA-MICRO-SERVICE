services:
  mariadb:
    image: mariadb:latest
    environment:
      MARIADB_DATABASE: usuario
      MARIADB_USER: microservice
      MARIADB_PASSWORD: microservice-local-only
      MARIADB_ROOT_PASSWORD: root-local-only
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./infra/mariadb/init:/docker-entrypoint-initdb.d:ro
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  comercio:
    build: ./comercio
    image: comercio:local
    environment:
      SPRING_DATASOURCE_URL: jdbc:mariadb://mariadb:3306/comercio
      SPRING_DATASOURCE_USERNAME: microservice
      SPRING_DATASOURCE_PASSWORD: microservice-local-only
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx256m"
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped

  produto:
    build: ./produto
    image: produto:local
    environment:
      SERVER_PORT: "8081"
      SPRING_DATASOURCE_URL: jdbc:mariadb://mariadb:3306/produto_branch
      SPRING_DATASOURCE_USERNAME: microservice
      SPRING_DATASOURCE_PASSWORD: microservice-local-only
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx256m"
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped

  usuario:
    build: ./usuario
    image: usuario:local
    environment:
      SPRING_DATASOURCE_URL: jdbc:mariadb://mariadb:3306/usuario
      SPRING_DATASOURCE_USERNAME: microservice
      SPRING_DATASOURCE_PASSWORD: microservice-local-only
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no arquivo .env}
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx256m"
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped

  gateway:
    build: ./gateway
    image: gateway:local
    ports:
      - "8080:8080"
    environment:
      COMERCIO_URL: http://comercio:8080
      PRODUTO_URL: http://produto:8081
      USUARIO_URL: http://usuario:8080
      JAVA_TOOL_OPTIONS: "-Xms64m -Xmx256m"
    depends_on:
      - comercio
      - produto
      - usuario
    networks:
      - backend
    restart: unless-stopped

networks:
  backend:

volumes:
  mariadb_data:
