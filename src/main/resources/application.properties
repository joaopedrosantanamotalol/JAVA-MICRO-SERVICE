spring.application.name=usuario

spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3307/usuario}
spring.datasource.username=${DB_USERNAME:microservice}
spring.datasource.password=${DB_PASSWORD:microservice-local-only}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

jwt.secret=${JWT_SECRET}


# CORS global do Spring Cloud Gateway
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOrigins=${FRONTEND_ORIGIN}

spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,PATCH,DELETE,OPTIONS

spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=Content-Type,Authorization,X-CSRF-TOKEN

spring.cloud.gateway.globalcors.cors-configurations.[/**].allowCredentials=true

spring.cloud.gateway.globalcors.cors-configurations.[/**].maxAge=3600

